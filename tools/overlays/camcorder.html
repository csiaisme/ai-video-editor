<!-- 疊加卡片模板 camcorder(攝影機取景器 HUD)
     來源:HyperFrames registry「camcorder-hud」(REC 紅點閃、電池、日期、計時)。
     改編:直式安全區版面 —— 上排:左 ● REC、右 電池(電池在臉的右邊、不壓臉);下排在字幕上面:左 日期(+時間)、右 計時。
     日期中文慣用 2026.10.07(預設今天,date= 可改)、時間 time="下午 3:24"(選填)、mode 預設「SP · 9:16」。
     計時從 counter_start 秒開始;bottom = 下排離畫面底多少 px(預設 470,在 IG 下方介面區 + 字幕之上)。 -->
<style>
      .ov-camcorder { position:absolute; inset:0; pointer-events:none; color:#fff; font-weight:700; font-size:44px; line-height:1.25;
        font-family:"OvMono","OvSans",monospace; -webkit-text-stroke:2px rgb(0 0 0 / 85%); paint-order:stroke fill;
        text-shadow:0 3px 10px rgb(0 0 0 / 90%); }
      .ov-cam-c { position:absolute; }
      .ov-cam-rec { top:calc(var(--safe-top, 221px) + 10px); left:var(--safe-left, 54px); display:flex; align-items:center; gap:18px; }
      .ov-cam-dot { width:30px; height:30px; border-radius:50%; background:#f12c2c; box-shadow:0 0 12px rgb(241 44 44 / 60%); -webkit-text-stroke:0; }
      .ov-cam-bat { top:calc(var(--safe-top, 221px) + 14px); right:var(--safe-right, 119px); width:84px; height:42px; border:4px solid currentcolor;
        box-shadow:0 2px 8px rgb(0 0 0 / 70%); }
      .ov-cam-bat::before { content:""; position:absolute; top:6px; left:6px; width:56px; height:22px; background:currentcolor; }
      .ov-cam-bat::after { content:""; position:absolute; top:9px; right:-14px; width:8px; height:16px; background:currentcolor; }
      .ov-cam-date { left:var(--safe-left, 54px); }
      .ov-cam-date .ov-cam-time { display:block; font-family:"OvSans",sans-serif; font-size:38px; }
      .ov-cam-cnt { right:var(--safe-right, 119px); text-align:right; }
      .ov-cam-mode { display:block; font-size:30px; margin-bottom:6px; }
</style>
<template>
<div class="ov-cam-c ov-cam-rec"><span class="ov-cam-dot" id="{{u}}-dot"></span><span>REC</span></div>
<div class="ov-cam-c ov-cam-bat"></div>
<div class="ov-cam-c ov-cam-date" style="bottom:{{bottom}}px;">{{date}}{{time}}</div>
<div class="ov-cam-c ov-cam-cnt" style="bottom:{{bottom}}px;"><span class="ov-cam-mode">{{mode}}</span><span id="{{u}}-cnt">00:00:00</span></div>
</template>
<script>
      const {{u}}s = { t: 0 }, {{u}}c = document.getElementById("{{u}}-cnt"), {{u}}d = document.getElementById("{{u}}-dot");
      function {{u}}hud() { const v = Math.max(0, Math.floor({{start}} + {{u}}s.t));
        {{u}}c.textContent = [Math.floor(v / 3600), Math.floor((v % 3600) / 60), v % 60].map((x) => String(x).padStart(2, "0")).join(":");
        {{u}}d.style.opacity = Math.floor({{u}}s.t / 0.55) % 2 === 0 ? "1" : "0.25"; }
      {{O}}.to({{u}}s, { t: {{D}}, duration: {{D}}, ease: "none", onUpdate: {{u}}hud }, 0);
      {{u}}hud();
</script>
